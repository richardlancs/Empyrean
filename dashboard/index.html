<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empyrean dashboard</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #181b22;
    --line: #2a2f3a;
    --text: #eef1f6;
    --muted: #9aa3b2;
    --danger: #e5484d;
    --danger-bg: #3a1416;
    --touch: #3fb950;
    --sim: #f5a524;
    --sim-bg: #3a2a0a;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header h1 { font-size: 18px; margin: 0; }
  .tag {
    font-size: 12px;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px 8px;
  }
  .spacer { flex: 1; }
  .status { font-size: 13px; color: var(--muted); }
  .status::before {
    content: "";
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 6px;
    background: var(--danger);
  }
  .status.live::before { background: var(--touch); }
  button {
    font: inherit;
    font-weight: 600;
    color: #1a1204;
    background: var(--sim);
    border: 0;
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: progress; }
  button:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }

  main {
    display: grid;
    grid-template-columns: minmax(0, 2fr) minmax(300px, 1fr);
    grid-template-areas: "warning warning" "video side";
    gap: 16px;
    padding: 16px 20px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .panel h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    margin: 0 0 10px;
  }

  #warning { grid-area: warning; transition: background .2s, border-color .2s; }
  #warning.active { background: var(--danger-bg); border-color: var(--danger); }
  .warning-body { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  #warning-text { font-size: 28px; font-weight: 700; }
  #warning.active #warning-text { color: #ffd7d8; }
  #warning-meta { color: var(--muted); }

  .video {
    grid-area: video;
    min-height: 360px;
    display: grid;
    place-items: center;
    color: var(--muted);
    text-align: center;
  }
  #feed {
    width: 100%;
    height: auto;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 6px;
  }
  #feed[hidden], #feed-offline[hidden] { display: none; }
  .side { grid-area: side; display: grid; gap: 16px; align-content: start; }
  .empty { color: var(--muted); margin: 0; }

  #voice-status { color: var(--muted); font-size: 13px; }
  #transcripts { list-style: none; margin: 0; padding: 0; }
  #transcripts li { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; overflow-wrap: anywhere; }
  #answer { color: var(--muted); }
  #objects { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  #objects li {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 10px;
    align-items: baseline;
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  #objects li.touched { border-color: var(--touch); background: #0f2a17; }
  #objects li.lost { opacity: .6; }
  .obj-name { font-weight: 600; overflow-wrap: anywhere; }
  .obj-name .unnamed { font-weight: 400; color: var(--muted); }
  .state {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .05em;
    text-transform: uppercase;
    border-radius: 4px;
    padding: 1px 6px;
    color: var(--muted);
    border: 1px solid var(--line);
  }
  .state.touching { color: #8ee0a1; border-color: var(--touch); }
  .state.held { color: var(--sim); border-color: var(--sim); }
  .seen { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; min-width: 3.5em; text-align: right; }

  #events { list-style: none; margin: 0; padding: 0; }
  #events li {
    display: grid;
    grid-template-columns: auto auto 1fr;
    gap: 4px 10px;
    align-items: baseline;
    padding: 8px 0;
    border-top: 1px solid var(--line);
  }
  #events li:first-child { border-top: 0; }
  .time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
  .kind {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .05em;
    border-radius: 4px;
    padding: 1px 6px;
  }
  .kind.hazard { background: var(--danger-bg); color: #ffb3b5; }
  .kind.touch { background: #0f2a17; color: #8ee0a1; }
  .what { font-weight: 600; }
  .detail { grid-column: 3; color: var(--muted); font-size: 13px; }
  .sim {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--sim);
    background: var(--sim-bg);
    border: 1px solid var(--sim);
    border-radius: 4px;
    padding: 0 6px;
    margin-left: 6px;
    vertical-align: 2px;
  }

  @media (max-width: 760px) {
    header { flex-wrap: wrap; }
    main { grid-template-columns: 1fr; grid-template-areas: "warning" "side" "video"; padding: 16px; }
    .video { min-height: 200px; }
  }
</style>
</head>
<body>
<header>
  <h1>Empyrean</h1>
  <span class="tag">Prototype</span>
  <span class="spacer"></span>
  <button id="microphone" type="button" aria-pressed="false"
          title="Speech recognition may send audio to your browser’s speech service.">Start microphone</button>
  <span id="voice-status" role="status">Microphone off</span>
  <span id="status" class="status" role="status">Connecting</span>
  <button id="simulate" type="button"
          title="Adds a simulated stairs warning to this page only. No alarm sounds and nothing is stored.">
    Simulate alert
  </button>
</header>

<main>
  <section id="warning" class="panel" aria-live="assertive">
    <h2>Latest warning</h2>
    <div class="warning-body">
      <span id="warning-text">No warnings yet</span>
      <span id="warning-meta"></span>
    </div>
  </section>

  <section class="panel video" aria-label="Camera feed">
    <img id="feed" src="/video" alt="Live camera feed with object boxes and fingertip dots">
    <p id="feed-offline" hidden>Camera feed not connected.<br>Retrying.</p>
  </section>

  <div class="side">
    <section class="panel">
      <h2>Objects</h2>
      <p id="objects-empty" class="empty">No objects in view.</p>
      <ul id="objects"></ul>
    </section>
    <section class="panel">
      <h2>Voice input</h2>
      <p id="transcripts-empty" class="empty">Nothing heard yet.</p>
      <ul id="transcripts"></ul>
      <p id="answer" aria-live="polite"></p>
    </section>
    <section class="panel">
      <h2>Recent events</h2>
      <p id="events-empty" class="empty">No events yet.</p>
      <ul id="events"></ul>
    </section>
  </div>
</main>

<script>
  "use strict";
  const els = {
    status: document.getElementById("status"),
    button: document.getElementById("simulate"),
    warning: document.getElementById("warning"),
    warningText: document.getElementById("warning-text"),
    warningMeta: document.getElementById("warning-meta"),
    events: document.getElementById("events"),
    eventsEmpty: document.getElementById("events-empty"),
    objects: document.getElementById("objects"),
    objectsEmpty: document.getElementById("objects-empty"),
    feed: document.getElementById("feed"),
    feedOffline: document.getElementById("feed-offline"),
  };

  // The server sends a "Waiting for camera" picture until the first frame, so an
  // error here means the server itself is unreachable.
  function reloadFeed() {
    els.feed.src = "/video?t=" + Date.now();
  }
  els.feed.addEventListener("load", () => {
    els.feed.hidden = false;
    els.feedOffline.hidden = true;
  });
  els.feed.addEventListener("error", () => {
    els.feed.hidden = true;
    els.feedOffline.hidden = false;
    setTimeout(reloadFeed, 2000);
  });
  let latest = null;
  let activeSeconds = 0;
  let clockOffset = 0;  // server seconds minus browser seconds

  function serverNow() { return Date.now() / 1000 + clockOffset; }

  function clockTime(ts) {
    return new Date(ts * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }

  function simBadge() {
    const badge = document.createElement("span");
    badge.className = "sim";
    badge.textContent = "Simulated";
    return badge;
  }

  function render(state) {
    if (state.answer) showAnswer(state.answer);
    clockOffset = state.now - Date.now() / 1000;
    activeSeconds = state.hazard_active_seconds;
    latest = state.latest_warning;

    els.warningText.textContent = latest ? latest.text : "No warnings yet";
    if (latest && latest.simulated) els.warningText.appendChild(simBadge());

    const items = state.events.map((event) => {
      const li = document.createElement("li");
      const time = document.createElement("span");
      time.className = "time";
      time.textContent = clockTime(event.ts);
      const kind = document.createElement("span");
      kind.className = "kind " + event.kind;
      kind.textContent = event.kind === "hazard" ? "HAZARD" : "TOUCH";
      const what = document.createElement("span");
      what.className = "what";
      what.textContent = event.text;
      if (event.simulated) what.appendChild(simBadge());
      li.append(time, kind, what);
      if (event.detail) {
        const detail = document.createElement("span");
        detail.className = "detail";
        detail.textContent = event.detail;
        li.appendChild(detail);
      }
      return li;
    });
    els.events.replaceChildren(...items);
    els.eventsEmpty.hidden = items.length > 0;
    renderObjects(state.objects || []);
    tick();
  }

  function renderObjects(objects) {
    const rows = objects.map((obj) => {
      const li = document.createElement("li");
      li.className = obj.state;
      if (obj.state === "touching" || obj.state === "held") li.classList.add("touched");
      const name = document.createElement("span");
      name.className = "obj-name";
      name.textContent = obj.text;
      if (!obj.named) {
        const note = document.createElement("span");
        note.className = "unnamed";
        note.textContent = " (naming…)";
        name.appendChild(note);
      }
      const state = document.createElement("span");
      state.className = "state " + obj.state;
      state.textContent = obj.state;
      const seen = document.createElement("span");
      seen.className = "seen";
      seen.dataset.ts = obj.last_seen_ts;
      li.append(name, state, seen);
      return li;
    });
    els.objects.replaceChildren(...rows);
    els.objectsEmpty.hidden = rows.length > 0;
    updateSeen();
  }

  function updateSeen() {
    const now = serverNow();
    for (const el of els.objects.querySelectorAll(".seen")) {
      const age = Math.max(0, now - Number(el.dataset.ts));
      el.textContent = age < 0.5 ? "now" : age.toFixed(1) + " s";
    }
  }

  function tick() {
    updateSeen();
    if (!latest) {
      els.warning.classList.remove("active");
      els.warningMeta.textContent = "";
      return;
    }
    const age = Math.max(0, serverNow() - latest.ts);
    els.warning.classList.toggle("active", age < activeSeconds);
    const parts = [clockTime(latest.ts), Math.round(age) + " s ago"];
    if (latest.detail) parts.push(latest.detail);
    els.warningMeta.textContent = parts.join(" · ");
  }
  setInterval(tick, 250);

  let everConnected = false;
  function connect() {
    const scheme = location.protocol === "https:" ? "wss" : "ws";
    const socket = new WebSocket(`${scheme}://${location.host}/ws`);
    socket.onopen = () => {
      els.status.textContent = "Live";
      els.status.classList.add("live");
      if (everConnected) reloadFeed();  // the old stream died with the server
      everConnected = true;
    };
    socket.onmessage = (message) => render(JSON.parse(message.data));
    socket.onclose = () => {
      els.status.textContent = "Reconnecting";
      els.status.classList.remove("live");
      setTimeout(connect, 1000);
    };
  }
  connect();

  const microphone = document.getElementById("microphone");
  const voiceStatus = document.getElementById("voice-status");
  const transcripts = document.getElementById("transcripts");
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let enabled = false;
  let listening = false;
  let starting = false;
  let pending = false;
  let resumeTimer = null;
  let quietUntil = 0;
  let lastAnswer = "";
  let networkFailures = 0;
  let retryDelay = 300;

  // The audio bus has no speech-finished message. Allow a conservative playback
  // window before listening again; actual playback completion is not observable.
  function pauseForSpeech(text) {
    quietUntil = Math.max(quietUntil, Date.now() + 2000 + text.split(/\s+/).length * 500);
    if (recognition && (listening || starting)) recognition.abort();
    scheduleListening();
  }
  function showAnswer(text) {
    document.getElementById("answer").textContent = text;
    if (text !== lastAnswer) {
      lastAnswer = text;
      pauseForSpeech(text);
    }
  }
  function scheduleListening() {
    clearTimeout(resumeTimer);
    if (!enabled || pending || listening || starting) return;
    resumeTimer = setTimeout(startListening, Math.max(retryDelay, quietUntil - Date.now()));
  }
  function startListening() {
    if (!enabled || pending || listening || starting) return;
    if (Date.now() < quietUntil) { scheduleListening(); return; }
    try {
      starting = true;
      voiceStatus.textContent = "Starting microphone…";
      recognition.start();
    } catch (_) {
      starting = false;
      enabled = false;
      updateMicrophone();
      voiceStatus.textContent = "Click Start microphone to enable voice input.";
    }
  }
  function updateMicrophone() {
    microphone.textContent = enabled ? "Stop microphone" : "Start microphone";
    microphone.setAttribute("aria-pressed", String(enabled));
  }
  async function submitSpeech(text) {
    if (pending || !text.trim()) return;
    pending = true;
    if (recognition && (listening || starting)) recognition.abort();
    const row = document.createElement("li");
    row.textContent = text;
    transcripts.prepend(row);
    while (transcripts.children.length > 10) transcripts.lastElementChild.remove();
    document.getElementById("transcripts-empty").hidden = true;
    voiceStatus.textContent = "Processing…";
    try {
      const response = await fetch("/api/question", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({text: text.trim()}),
      });
      const result = await response.json();
      if (!response.ok) throw new Error(typeof result.detail === "string" ? result.detail : "Question could not be sent.");
      document.getElementById("answer").textContent = result.answer;
      // Always pause, including repeated identical answers.
      lastAnswer = result.answer;
      pauseForSpeech(result.answer);
      voiceStatus.textContent = enabled ? "Waiting for spoken answer…" : "Microphone off";
    } catch (error) {
      voiceStatus.textContent = error.message || "Could not send the question.";
    } finally {
      pending = false;
      scheduleListening();
    }
  }
  if (!Recognition) {
    microphone.disabled = true;
    voiceStatus.textContent = "Voice input needs a supported browser, such as Chrome or Safari.";
  } else {
    recognition = new Recognition();
    recognition.lang = "en-US";
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.onstart = () => {
      starting = false;
      listening = true;
      if (!enabled || pending || Date.now() < quietUntil) { recognition.abort(); return; }
      voiceStatus.textContent = "Listening…";
    };
    recognition.onresult = (event) => {
      const result = event.results[event.resultIndex];
      if (!enabled || pending || Date.now() < quietUntil || !result.isFinal) return;
      networkFailures = 0;
      retryDelay = 300;
      submitSpeech(result[0].transcript);
    };
    recognition.onerror = (event) => {
      if (event.error === "aborted" || event.error === "no-speech") return;
      if (event.error === "network" && enabled && networkFailures < 3) {
        networkFailures += 1;
        retryDelay = 1000 * networkFailures;
        voiceStatus.textContent = `Speech connection interrupted. Retrying (${networkFailures}/3)…`;
        return;  // onend schedules the next attempt
      }
      enabled = false;
      clearTimeout(resumeTimer);
      updateMicrophone();
      const messages = {
        "not-allowed": "Allow microphone access, then click Start microphone.",
        "audio-capture": "No microphone available. Check sound input settings.",
        "network": "Speech recognition service unavailable in this browser. Open http://localhost:8000 in Google Chrome. If already in Chrome, check your connection.",
      };
      voiceStatus.textContent = messages[event.error] || "Voice input stopped. Click Start microphone to retry.";
    };
    recognition.onend = () => {
      starting = false;
      listening = false;
      scheduleListening();
    };
    microphone.addEventListener("click", () => {
      enabled = !enabled;
      updateMicrophone();
      if (enabled) {
        networkFailures = 0;
        retryDelay = 300;
        startListening();
      }
      else {
        clearTimeout(resumeTimer);
        recognition.abort();
        voiceStatus.textContent = "Microphone off";
      }
    });
    window.addEventListener("pagehide", () => {
      enabled = false;
      clearTimeout(resumeTimer);
      recognition.abort();
    });
    // Listening is opt-in for this page load. A browser session ending is
    // retried while enabled; only Stop or an explained error disables it.
    updateMicrophone();
  }

  els.button.addEventListener("click", async () => {
    els.button.disabled = true;
    try {
      const response = await fetch("/api/simulate-alert", { method: "POST" });
      if (response.ok) render(await response.json());
    } finally {
      els.button.disabled = false;
    }
  });
</script>
</body>
</html>
